<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroConnect</title>
    <link rel="shortcut icon" href="Assets/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="styles/register.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="Assets/logo.svg">
        </a>
        <nav>
            <a onclick="alert('EM CONSTRUÇÂO')">PRODUTORES</a>
            <a href="produto.html">PRODUTOS</a>
            <div id="right">
                <a href="register.html">CADASTRE-SE</a>
                <a href="login.html">
                    <button type="button">LOGIN</button>
                </a>
            </div>
        </nav>
    </header>
    <main>
        <h2 id="ds">CADASTRE-SE</h2>
        <div class="panel">
            <form id="registerForm">
                <div class="inp">
                    <label for="name">Nome</label>
                    <input id="name" name="name" type="text" required>
                </div>
                <div class="inp">
                    <label for="cpf">CPF/CNPJ</label>
                    <input id="cpf" name="cpf" type="number" required>
                </div>
                <div class="section">
                    <div class="inp">
                        <label for="email">E-mail</label>
                        <input id="email" type="email" required>
                    </div>
                    <div class="inp">
                        <label for="pwd">Senha</label>
                        <input id="pwd" type="password" required>
                    </div>
                </div>
                <div class="actions">
                    <a>ESQUECI MINHA SENHA</a>
                    <button id="login" type="submit">ENTRAR</button>
                </div>
            </form>
        </div>
    </main>
</body>
<script src="scripts/register.js"></script>

</html>
